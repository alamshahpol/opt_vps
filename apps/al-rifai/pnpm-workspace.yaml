minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Targeted audited security fixes only. No general minimum-age bypass.
minimumReleaseAgeExclude:
  - next@16.4.1
  - eslint-config-next@16.4.1
  - '@babel/core@7.29.6'
  - browserslist@4.28.7
  - baseline-browser-mapping@2.11.0
  - fast-uri@3.1.9
  - source-map-js@1.2.2
  - sharp@0.35.5
  - zod@4.6.6

overrides:
  "@babel/core": "7.29.6"
  "browserslist": "4.28.7"
  "baseline-browser-mapping": "2.11.0"
  "fast-uri": "3.1.9"
  "source-map-js": "1.2.2"
  "sharp": "0.35.5"
  # Security fixes for build/development tools; scoped where major versions differ.
  "js-yaml": "4.3.2"
  "brace-expansion@<2": "1.1.21"
  "brace-expansion@>=5 <6": "5.0.12"
  "@esbuild-kit/core-utils>esbuild": "0.25.12"
  "tsx>esbuild": "0.28.1"
  "zod": "4.6.6"
