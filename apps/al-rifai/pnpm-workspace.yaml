minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Targeted audited security fixes only. No general minimum-age bypass.
minimumReleaseAgeExclude:
  - next@16.3.8
  - eslint-config-next@16.3.8
  - '@babel/core@7.29.6'
  - browserslist@4.28.7
  - baseline-browser-mapping@2.11.0
  - fast-uri@3.1.8
  - source-map-js@1.2.2
  - sharp@0.35.5

overrides:
  "@babel/core": "7.29.6"
  "browserslist": "4.28.7"
  "baseline-browser-mapping": "2.11.0"
  "fast-uri": "3.1.8"
  "source-map-js": "1.2.2"
  "sharp": "0.35.5"
